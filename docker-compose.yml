version: '3.8'

services:
  nodex:
    build: .
    ports:
      - "8080:80"
    restart: unless-stopped

  # Probe agent for live monitoring (ping, TCP, HTTP). Published on
  # localhost only: the browser running Nodex on this machine reaches it at
  # http://localhost:7070. To use it from other machines, publish it more
  # widely AND set NODEX_MONITOR_TOKEN.
  monitor:
    build: ./monitor
    ports:
      - "127.0.0.1:7070:7070"
    environment:
      # Only probe addresses inside these networks (comma-separated CIDRs)
      - NODEX_MONITOR_ALLOW=${NODEX_MONITOR_ALLOW:-}
      # Require `Authorization: Bearer <token>` (set the same token in Nodex)
      - NODEX_MONITOR_TOKEN=${NODEX_MONITOR_TOKEN:-}
    sysctls:
      # Unprivileged ping (Docker's default, made explicit)
      - net.ipv4.ping_group_range=0 2147483647
    restart: unless-stopped

  # Optional Nodex server: stores diagrams so the editor and MCP clients
  # (Claude Code, Claude Desktop, ...) work on the same documents, live.
  # Off unless asked for:
  #   NODEX_SERVER_TOKEN=$(openssl rand -hex 32) docker compose --profile server up -d
  # The editor reaches it same-origin at /server (see nginx.conf), and MCP
  # clients at <nodex url>/server/mcp with the same bearer token.
  server:
    profiles: ["server"]
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "127.0.0.1:7071:7071"
    environment:
      # Required - the server refuses to start without one
      - NODEX_SERVER_TOKEN=${NODEX_SERVER_TOKEN:-}
    volumes:
      - nodex-data:/data
    restart: unless-stopped

volumes:
  nodex-data:
