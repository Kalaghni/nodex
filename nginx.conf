server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Monitor agent, same-origin under /monitor/ (no mixed content, no CORS).
    # The upstream is resolved per request, so this image still starts on its
    # own when no `monitor` service exists (that path then answers 502).
    location /monitor/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $nodex_monitor http://monitor:7070;
        rewrite ^/monitor/(.*)$ /$1 break;
        proxy_pass $nodex_monitor;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        # A full 256-target probe is up to 8 batches of ≤10 s
        proxy_read_timeout 90s;
        client_max_body_size 300k;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
